# Local test kit (not used by Railway): app + Postgres 17 + RustFS standing in for a Railway Bucket.
services:
  db:
    image: postgres:17
    environment: {POSTGRES_USER: wygiwyh, POSTGRES_PASSWORD: localtestpw, POSTGRES_DB: wygiwyh}
    volumes: [pg:/var/lib/postgresql/data]
  s3:
    image: rustfs/rustfs:1.0.5
    environment: {RUSTFS_ACCESS_KEY: localkey, RUSTFS_SECRET_KEY: localsecret123, RUSTFS_ADDRESS: "0.0.0.0:9000"}
  mkbucket:
    build: ..
    depends_on: [s3]
    entrypoint: ["/app/.venv/bin/python", "-c", "import boto3,time\nfor i in range(60):\n  try:\n    boto3.client('s3',endpoint_url='http://s3:9000',aws_access_key_id='localkey',aws_secret_access_key='localsecret123',region_name='us-east-1').create_bucket(Bucket='wyg'); print('bucket ok'); break\n  except Exception as e:\n    print(e); time.sleep(2)"]
  web:
    build: ..
    depends_on:
      db: {condition: service_started}
      mkbucket: {condition: service_completed_successfully}
    ports: ["8080:8080"]
    mem_limit: 512m
    cpus: 1
    environment:
      PORT: "8080"
      SECRET_KEY: local-test-secret-key-0123456789abcdef
      SQL_HOST: db
      SQL_PORT: "5432"
      SQL_USER: wygiwyh
      SQL_PASSWORD: localtestpw
      SQL_DATABASE: wygiwyh
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: LocalAdminPw123
      HTTPS_ENABLED: "false"
      URL: http://localhost:8080
      AWS_STORAGE_BUCKET_NAME: wyg
      AWS_ENDPOINT_URL: http://s3:9000
      AWS_S3_REGION_NAME: us-east-1
      AWS_ACCESS_KEY_ID: localkey
      AWS_SECRET_ACCESS_KEY: localsecret123
      AWS_S3_ADDRESSING_STYLE: path
volumes: {pg: {}}
